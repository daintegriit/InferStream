[pytest]
# pytest does not add the working directory to sys.path. Without this,
# `from main import app` in backend/tests/conftest.py fails regardless of
# where pytest is invoked from.
pythonpath = backend

# The existing suite uses async fixtures and async tests without explicit
# marks. Strict mode (the default) errors on those under pytest 9; auto
# mode treats them as asyncio without requiring a decorator on each one.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = backend/tests
python_files = test_*.py
addopts = -v --tb=short